<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>عيد ميلاد علي 🎉</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    text-align:center;
    background:#7b1330;
    position:relative;
  }
  canvas#fx{ position:fixed; inset:0; pointer-events:none; z-index:50; }

  .screen{
    position:absolute; inset:0;
    display:none;
    align-items:center; justify-content:center;
    flex-direction:column;
    transition:opacity .4s ease;
  }
  .screen.active{ display:flex; }

  /* ---------- LOGIN ---------- */
  #loginPage{ background:radial-gradient(circle at 30% 20%, #ff4d6d, #7b1330 70%); }
  .stars{ position:absolute; inset:0; overflow:hidden; }
  .star{ position:absolute; width:3px; height:3px; background:#fff; border-radius:50%; opacity:.7; animation:twinkle 2.5s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.2;} 50%{opacity:1;} }

  .loginBox{
    background:#fdf3e7;
    padding:38px 28px;
    border-radius:28px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
    width:82%; max-width:320px;
    z-index:2;
    animation:pop-in .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop-in{ from{transform:scale(.7); opacity:0;} to{transform:scale(1); opacity:1;} }
  .loginBox .emoji-row{ font-size:34px; margin-bottom:6px; }
  .loginBox h2{ margin:0 0 20px; color:#7b1330; font-size:21px; }
  input{
    display:block; margin:12px auto; padding:12px 16px;
    border-radius:20px; border:2px solid #eecdb0;
    width:85%; font-size:16px; text-align:center;
    font-family:inherit;
  }
  input:focus{ outline:none; border-color:#dc143c; }
  button{
    padding:12px 30px; border:none; border-radius:20px;
    background:linear-gradient(135deg,#dc143c,#ff4d6d);
    color:white; cursor:pointer; font-size:16px; font-weight:bold;
    margin-top:8px; box-shadow:0 6px 16px rgba(220,20,60,0.5);
    transition:transform .15s ease; font-family:inherit;
  }
  button:active{ transform:scale(0.94); }
  .hint{ color:#a56b3f; font-size:13px; margin-top:10px; }

  /* ---------- CANDLE / TRANSITION ---------- */
  #transition{ background:radial-gradient(circle at center,#3a0d1a,#1a0009 80%); }
  .candleWrap{ position:relative; cursor:pointer; user-select:none; }
  .cake-emoji{ font-size:76px; display:block; }
  .flame{
    position:absolute; top:-22px; left:50%; transform:translateX(-50%);
    font-size:26px; animation:flicker 0.4s ease-in-out infinite alternate;
    transform-origin:bottom center;
  }
  @keyframes flicker{
    0%{ transform:translateX(-50%) scale(1) rotate(-3deg); }
    100%{ transform:translateX(-50%) scale(1.15) rotate(3deg); }
  }
  .flame.out{ animation:none; opacity:0; transition:opacity .3s ease; }
  #transition p{ color:#ffe1e6; font-size:19px; margin-top:22px; font-weight:bold; }
  #transition .sub{ color:#ffb3c1; font-size:14px; margin-top:6px; font-weight:normal; }
  .smokeWrap{ position:absolute; top:-22px; left:50%; transform:translateX(-50%); }
  .smoke{ position:absolute; font-size:16px; opacity:0; color:#ccc; }

  /* ---------- GALLERY ---------- */
  #gallery{ background:radial-gradient(circle at center,#ffd6de,#ff8fa3 85%); }
  #galleryTitle{
    position:absolute; top:7%; color:#7b1330; font-size:clamp(18px,5vw,24px);
    font-weight:bold; text-shadow:0 1px 3px rgba(255,255,255,0.6); z-index:2;
    animation:pop-in .5s ease;
  }
  .circle{
    position:relative;
    width:min(94vw,420px); height:min(94vw,420px);
    border-radius:50%;
    animation:rotate 26s linear infinite;
  }
  @keyframes rotate{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .imgBox{ position:absolute; width:92px; text-align:center; top:50%; left:50%; }
  .imgBox img{
    width:76px; height:76px; object-fit:cover; border-radius:50%;
    border:3px solid #fff; box-shadow:0 4px 14px rgba(0,0,0,0.3);
    cursor:pointer; transition:transform .2s ease;
  }
  .imgBox img:active{ transform:scale(0.9); }
  .caption{ font-size:11px; color:#7b1330; font-weight:bold; margin-top:4px; }
  #skip{
    position:absolute; bottom:6%; background:rgba(255,255,255,0.65);
    border:none; border-radius:16px; padding:9px 20px; font-size:13px;
    color:#7b1330; cursor:pointer; z-index:2; font-weight:bold;
  }

  /* image lightbox */
  #lightbox{
    position:fixed; inset:0; background:rgba(0,0,0,0.75);
    display:none; align-items:center; justify-content:center; z-index:60;
  }
  #lightbox.active{ display:flex; }
  #lightbox img{ max-width:80vw; max-height:70vh; border-radius:16px; border:4px solid #fff; }

  /* ---------- MESSAGE ---------- */
  #message{ background:linear-gradient(160deg,#ffc0cb,#fff0e6); padding:26px 18px; }
  #message .msgBox{
    max-width:600px; max-height:64vh; overflow-y:auto;
    background:rgba(255,255,255,0.6); border-radius:22px; padding:22px;
    font-size:17px; line-height:2; color:#4a0d1f; white-space:pre-line;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
  }
  #celebrateBtn{
    display:none; margin-top:18px; padding:13px 34px;
    background:linear-gradient(135deg,#dc143c,#ff4d6d); color:#fff;
    border:none; border-radius:24px; font-size:16px; font-weight:bold;
    cursor:pointer; box-shadow:0 8px 20px rgba(220,20,60,0.5); font-family:inherit;
  }

  /* ---------- SPECIAL WISH SCREEN ---------- */
  #wishScreen{ background:radial-gradient(circle at center,#4a0d2a,#1a0010); }
  #wishScreen h2{ color:#ffd6de; font-size:22px; margin-bottom:16px; }
  #wishInput{
    width:80%; max-width:320px; padding:12px 16px; border-radius:20px;
    border:none; font-size:15px; text-align:center; margin-bottom:14px; font-family:inherit;
  }
  #wishDisplay{
    color:#fff; font-size:20px; font-weight:bold; margin-top:20px; min-height:30px;
    text-shadow:0 0 12px #ff4d6d;
  }

  .muteBtn{
    position:fixed; top:14px; left:14px; z-index:70;
    background:rgba(255,255,255,0.25); border:none; border-radius:50%;
    width:38px; height:38px; font-size:17px; cursor:pointer; color:#fff;
  }

  .heart{ position:absolute; pointer-events:none; animation:floatUp 6s linear infinite; z-index:5; }
  @keyframes floatUp{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(-110vh) rotate(30deg); opacity:0; }
  }
</style>
</head>

/* ---------- floating hearts ---------- */
function createHearts(){
  const shapes = ["❤","💛","💙","🎈"];
  setInterval(()=>{
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML = shapes[Math.floor(Math.random()*shapes.length)];
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(14+Math.random()*20)+"px";
    document.body.appendChild(heart);
    setTimeout(()=>{heart.remove();},6000);
  },350);
}

/* ---------- confetti canvas ---------- */
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); window.addEventListener("resize", resize);
let particles = [];
function burstConfetti(x, y, count=80){
  const colors = ["#dc143c","#ff4d6d","#ffd166","#fff","#ff8fa3","#ffb703"];
  for(let i=0;i<count;i++){
    particles.push({
      x, y,
      vx:(Math.random()-0.5)*10,
      vy:(Math.random()-1.6)*10,
      size:4+Math.random()*5,
      color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360,
      vr:(Math.random()-0.5)*10,
      life:0
    });
  }
}
function animateConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
    ctx.save();
    ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
    ctx.restore();
  });
  particles = particles.filter(p=>p.life < 140 && p.y < canvas.height+50);
  requestAnimationFrame(animateConfetti);
}
animateConfetti();

/* ---------- tiny birthday jingle (Web Audio) ---------- */
let audioCtx;
function ensureAudio(){ if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } }
function playNote(freq, start, dur, type="sine", vol=0.15){
  if(muted) return;
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, audioCtx.currentTime+start);
  gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime+start+0.03);
  gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime+start+dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(audioCtx.currentTime+start);
  osc.stop(audioCtx.currentTime+start+dur+0.05);
}
function playHappyBirthdayJingle(){
  // short cheerful riff, not the full copyrighted melody, just a happy tune
  const notes = [523,523,587,523,698,659, 523,523,587,523,784,698];
  let t = 0;
  notes.forEach((f,i)=>{
    playNote(f, t, 0.28, "triangle");
    t += 0.3;
  });
}
function playChime(){ playNote(880,0,0.3,"sine",0.12); playNote(1318,0.08,0.35,"sine",0.1); }
function toggleMute(){
  muted = !muted;
  document.getElementById("muteBtn").textContent = muted ? "🔇" : "🔊";
  const music = document.getElementById("bgMusic");
  if(muted){ music.pause(); } else { music.play().catch(()=>{}); }
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ---------- LOGIN ---------- */
function login(){
  const val = document.getElementById("uname").value.trim();
  if(val) userName = val;
  const music = document.getElementById("bgMusic");
  music.volume = 0.55;
  music.play().catch(()=>{});
  createHearts();
  const rect = document.querySelector(".loginBox").getBoundingClientRect();
  burstConfetti(rect.left+rect.width/2, rect.top+rect.height/2, 60);
  playChime();
  showScreen("transition");
}

/* ---------- CANDLE BLOW ---------- */
let blown = false;
function blowCandle(){
  if(blown) return;
  blown = true;
  ensureAudio();
  document.getElementById("flame").classList.add("out");
  document.getElementById("candleText").textContent = "يا سلااام! عقبال المية سنة 🎉";
  const smokeWrap = document.getElementById("smokeWrap");
  for(let i=0;i<5;i++){
    const s = document.createElement("span");
    s.className = "smoke"; s.textContent = "💨";
    s.style.left = (Math.random()*20-10)+"px";
    s.style.animation = `smokeRise 1.2s ease-out ${i*0.1}s forwards`;
    smokeWrap.appendChild(s);
  }
  const style = document.createElement("style");
  style.textContent = `@keyframes smokeRise{0%{opacity:.8; transform:translateY(0);}100%{opacity:0; transform:translateY(-40px) translateX(10px);}}`;
  document.head.appendChild(style);
  const rect = document.getElementById("candleWrap").getBoundingClientRect();
  burstConfetti(rect.left+rect.width/2, rect.top, 100);
  playHappyBirthdayJingle();
  setTimeout(showImages, 1800);
}

/* ---------- GALLERY ---------- */
function showImages(){
  showScreen("gallery");
  document.getElementById("galleryTitle").textContent = "كل سنة وانت طيب يا " + userName + " 🎊";
  const circle = document.getElementById("circle");
  circle.innerHTML = "";
  const radius = Math.min(window.innerWidth*0.94, 420) / 2 - 50;
  const n = IMAGES.length;
  for(let i=0;i<n;i++){
    const angle = (i/n) * 2 * Math.PI;
    const x = radius * Math.cos(angle);
    const y = radius * Math.sin(angle);
    const div = document.createElement("div");
    div.className = "imgBox";
    div.style.transform = `translate(${x}px, ${y}px) translate(-50%,-50%)`;
    const img = document.createElement("img");
    img.src = IMAGES[i];
    img.onclick = (e)=>{ e.stopPropagation(); openLightbox(IMAGES[i]); };
    const cap = document.createElement("div");
    cap.className = "caption"; cap.textContent = "كل عام وانت بخير 🎊🤍";
    div.appendChild(img); div.appendChild(cap);
    circle.appendChild(div);
  }
}
function openLightbox(src){
  document.getElementById("lightboxImg").src = src;
  document.getElementById("lightbox").classList.add("active");
}

/* ---------- MESSAGE ---------- */
let messageStarted = false;
function startMessage(){
  if(messageStarted) return;
  messageStarted = true;
  showScreen("message");
  const box = document.getElementById("msgBox");
  box.innerHTML = "";
  let i = 0;
  function type(){
    if(i < MESSAGE.length){
      box.innerHTML += MESSAGE.charAt(i) === "\n" ? "<br>" : MESSAGE.charAt(i);
      box.scrollTop = box.scrollHeight;
      i++;
      setTimeout(type, 22);
    } else {
      document.getElementById("celebrateBtn").style.display = "inline-block";
    }
  }
  type();
}

/* ---------- WISH SCREEN ---------- */
function goWish(){
  document.getElementById("wishTitle").textContent = "اكتب أمنيتك يا " + userName + " ✨";
  showScreen("wishScreen");
}
function makeWish(){
  const val = document.getElementById("wishInput").value.trim();
  const display = document.getElementById("wishDisplay");
  if(!val){ display.textContent = "لازم تكتب حاجة الأول 😅"; return; }
  display.textContent = "🌠 تمام، أنا هعرف أمنيتك... ولما أكلمك تاني هزلك بيها 🌠";
  const rect = document.getElementById("wishScreen").getBoundingClientRect();
  burstConfetti(rect.width/2, rect.height/2, 140);
  playHappyBirthdayJingle();
  document.getElementById("wishInput").value = "";
}
